name: Deploy HeatingRegulator

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - Home
      serial_port:
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  build:
    uses: Zefek/GithubActions/.github/workflows/arduino-build-deploy.yml@d0f9e15e0cee0d6a5ab842556b55ac419cc4d3ac
    with:
      environment: ${{ inputs.environment }}
      serial_port: ${{ inputs.serial_port }}
      device_name: HeaterTemperatureRegulator
      source_dir: "."
